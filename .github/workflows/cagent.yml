# cagent 三平台构建与测试
#
# 为什么 CI 对本项目尤其重要：本产品的核心承诺是「极低内存」，
# 而这个承诺**只有在多平台上反复实测**才站得住。单平台跑通一次
# 说明不了任何问题——本项目此前就在「本地全绿、CI 全红」上栽过。
#
# libcurl 是**可选**依赖：找不到时降级为内存后端，构建仍应成功。
# 刻意不把它设为硬前置——NSIS 那次的教训是：把可选依赖变成阻塞项，
# 一次包源抖动就能拖红整条腿。
#
# 不缓存 build/：_deps 里的 googletest 产物与生成器/编译器版本强耦合。

name: cagent-build

on:
  push:
    branches: ["feat/c-agent", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux/macOS 先只观察、不参与放行（NDK 验证由后续步骤推进）。
          # 去掉 experimental 才是「三平台验证完成」。
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: false
    defaults:
      run:
        working-directory: product

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      # ---- 准备 libcurl 开发文件 ----
      # 单独成一步并回显版本：libcurl 的版本差异会体现在流式行为上，
      # 记下版本号，线上出问题时才知道该往哪个方向猜。
      - name: 准备 libcurl（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # GitHub 对 shell: bash 的默认调用是
          #     bash --noprofile --norc -eo pipefail {0}
          # **它自己就带 -e**。在脚本里写 \set -uo pipefail\ 只能追加、关不掉，
          # 于是任何失败都会在诊断语句之前把脚本掐死——症状是「步骤退出码
          # 原样等于失败命令的退出码，且一条注解都没有」。必须显式 set +e。
          set +e
          set -uo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            if ! sudo apt-get update -qq > curlsetup.log 2>&1 \
               || ! sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev >> curlsetup.log 2>&1; then
              echo "::error title=libcurl 安装失败::$(tail -c 1200 curlsetup.log | tr '\n' ' ')"
              cat curlsetup.log
              exit 1
            fi
          else
            if ! brew list curl >/dev/null 2>&1; then
              if ! brew install curl > curlsetup.log 2>&1; then
                echo "::error title=brew install curl 失败::$(tail -c 1200 curlsetup.log | tr '\n' ' ')"
                cat curlsetup.log
                exit 1
              fi
            fi
            echo "CURL_PREFIX=$(brew --prefix curl)" >> "$GITHUB_ENV"
          fi
          curl-config --version || echo "::warning::无 curl-config，find_package(CURL) 可能失败"

      - name: 准备 libcurl（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # GitHub 对 shell: bash 的默认调用是
          #     bash --noprofile --norc -eo pipefail {0}
          # **它自己就带 -e**。在脚本里写 \set -uo pipefail\ 只能追加、关不掉，
          # 于是任何失败都会在诊断语句之前把脚本掐死——症状是「步骤退出码
          # 原样等于失败命令的退出码，且一条注解都没有」。必须显式 set +e。
          set +e
          set -uo pipefail
          # 运行器自带 curl.exe，但通常**没有 MSVC 导入库**。vcpkg 提供与
          # 工具链匹配的二进制，避免从源码构建（那会拖垮 CI 时间）。
          #
          # 两个早先的错误让这一腿从来没跑起来过：
          #  1. `${{ env.VCPKG_INSTALLATION_ROOT }}` —— VCPKG_INSTALLATION_ROOT
          #     是**运行器镜像的 shell 环境变量**，不在 Actions 的 `env` 上下文里，
          #     所以它被展开成空字符串。
          #  2. GITHUB_ENV 只接受 `KEY=value`，却写成了 `KEY: value`，
          #     于是运行器在**第一步**就报 `Invalid format` 直接崩掉。
          # 正确做法：直接在 shell 里读，用 `=` 分隔。
          #
          # 注意不要写 `set -e`：那样 `vcpkg: command not found` 这类失败
          # 会以 127 静默退出，任何注解都不会有——正是本工作流最初的状态。
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "::error::未找到 vcpkg（VCPKG_INSTALLATION_ROOT 为空）"
            exit 1
          fi
          if ! command -v vcpkg >/dev/null 2>&1; then
            echo "::error::vcpkg 不在 PATH 上（VCPKG_INSTALLATION_ROOT=$VCPKG_INSTALLATION_ROOT）"
            exit 1
          fi
          echo "VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          if ! vcpkg install curl:x64-windows-static-md > vcpkg.log 2>&1; then
            echo "::error title=vcpkg install curl 失败::$(tail -c 1200 vcpkg.log | tr '\n' ' ')"
            cat vcpkg.log
            exit 1
          fi
          tail -3 vcpkg.log
          echo "VCPKG_INSTALLED_DIR=${VCPKG_INSTALLATION_ROOT}/installed/x64-windows-static-md" >> "$GITHUB_ENV"
          echo "vcpkg 就绪: ${VCPKG_INSTALLATION_ROOT}"

      - name: 准备 Python（用于内存实测交叉核对）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建（零告警为硬要求）
        shell: bash
        run: |
          # 刻意**不用 set -e**：一旦有它，cmake 失败会立刻带自己的退出码
          # 终止脚本，下面精心准备的诊断（注解 + 步骤摘要）一行都来不及输出。
          # 本工作流曾因此表现为「失败了但什么信息都没有」——
          # 排查者只知道红了，连哪一步、为什么都看不到。
          # GitHub 对 shell: bash 的默认调用是
          #     bash --noprofile --norc -eo pipefail {0}
          # **它自己就带 -e**。在脚本里写 \set -uo pipefail\ 只能追加、关不掉，
          # 于是任何失败都会在诊断语句之前把脚本掐死——症状是「步骤退出码
          # 原样等于失败命令的退出码，且一条注解都没有」。必须显式 set +e。
          set +e
          set -uo pipefail
          # $VCPKG_ROOT **只在 Windows 上存在**。早先无条件传
          #   -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/.../vcpkg.cmake"
          # 在 Linux/macOS 上展开成 /scripts/buildsystems/vcpkg.cmake，
          # 一个不存在的路径，CMake 必然报错。
          # 真正致命的是配上 `2>/dev/null || true` —— 报错被整条吞掉，
          # 后续步骤继续在损坏的缓存上跑，而日志里什么都看不到。
          # 这个工作流**从来没有一次是绿的**，原因就在这里。
          CA_CMAKE_ARGS=(-DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # 运行器上的变量名是 VCPKG_INSTALLATION_ROOT，而 CMake 的 vcpkg
            # 工具链文档里用的是 VCPKG_ROOT。两个名字长期混用。
            # 早先这里只认 $VCPKG_ROOT，于是 set -u 直接报
            # "VCPKG_ROOT: unbound variable" 崩掉——而且崩在诊断之前。
            VCPKG_HOME="${VCPKG_ROOT:-${VCPKG_INSTALLATION_ROOT:-}}"
            if [ -z "$VCPKG_HOME" ]; then
              echo "::error title=找不到 vcpkg 根目录::VCPKG_ROOT 与 VCPKG_INSTALLATION_ROOT 均为空"
              exit 1
            fi
            if [ ! -f "$VCPKG_HOME/scripts/buildsystems/vcpkg.cmake" ]; then
              echo "::error title=vcpkg 工具链文件不存在::$VCPKG_HOME/scripts/buildsystems/vcpkg.cmake"
              exit 1
            fi
            echo "vcpkg 根目录: $VCPKG_HOME"
            CA_CMAKE_ARGS+=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG_HOME/scripts/buildsystems/vcpkg.cmake")
          fi
          # 刻意不叫 CMAKE_ARGS：那是 GitHub Actions 自己的环境变量。
          #
          # 失败原因写进 **注解** 而不是只留在 job 日志里：
          # 注解能被公开 API 读到，日志不能（要鉴权）。排查时这一点很关键——
          # 早先的失败日志谁也看不到，于是「它一直在红」这件事长期无人知晓。
          # 失败详情同时写进 **步骤摘要**（$GITHUB_STEP_SUMMARY）。
          # `::error::` 注解会被命令解析器吞掉（本工作流已经吃过两次亏），
          # 而步骤摘要在网页端直接可见、不需要任何鉴权 —— 排查时最可靠。
          dump() {  # $1=标题 $2=日志文件
            # 注解携带实际内容：这是唯一一条**不需要鉴权**就能读到的诊断通道。
            echo "::error title=$1::$(tail -c 1500 "$2" | tr -d '\r' | tr '\n' ' ')"
            {
              echo "### ❌ $1"
              echo '```'; tail -c 4000 "$2"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if ! cmake -S . -B build "${CA_CMAKE_ARGS[@]}" > cfg.log 2>&1; then
            dump "CMake 配置失败" cfg.log; cat cfg.log; exit 1
          fi
          cat cfg.log
          if ! cmake --build build --config Release > build.log 2>&1; then
            dump "构建失败" build.log; cat build.log; exit 1
          fi
          cat build.log
          # 两种工具链的告警格式都要覆盖：
          #   MSVC   -> `warning C4996`
          #   GCC    -> `warning:`（后面跟文字，不是字母数字）
          # 早先只匹配前一种，等于 Linux 上的告警全部漏检。
          #
          # 告警内容必须写进**注解**，不能只 echo 到日志：
          # 日志要鉴权读不到，注解能。结果就是「谁也看不出哪里在告警」，
          # 于是告警门禁只会显示一句红字。
          if grep -qE "warning [A-Z]+[0-9]+|warning:" build.log; then
            WARN="$(grep -E 'warning [A-Z]+[0-9]+|warning:' build.log | head -6 | tr -d '\r' | tr '\n' ' ')"
            echo "::error title=构建产生告警::${WARN}"
            {
              echo "### ❌ 构建产生告警"
              echo '```'; grep -E "warning [A-Z]+[0-9]+|warning:" build.log | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "编译零告警 ✓"

      - name: 确认 libcurl 后端已编入
        shell: bash
        run: |
          set -e
          if grep -q "使用 libcurl 传输后端" build/CMakeCache.txt 2>/dev/null \
             || grep -rq "CAGENT_HAVE_CURL" build/CMakeFiles 2>/dev/null; then
            echo "libcurl 后端：已编入"
          else
            echo "::warning title=libcurl 后端未编入::本次仅验证内存后端"
          fi

      - name: 单元测试（含 100 MB 流式内存实测）
        shell: bash
        run: |
          # 同样**不用 set -e**：否则 ctest 的退出码 8（有测试失败）
          # 会直接冒泡成步骤退出码，诊断语句一行都不执行。
          # GitHub 对 shell: bash 的默认调用是
          #     bash --noprofile --norc -eo pipefail {0}
          # **它自己就带 -e**。在脚本里写 \set -uo pipefail\ 只能追加、关不掉，
          # 于是任何失败都会在诊断语句之前把脚本掐死——症状是「步骤退出码
          # 原样等于失败命令的退出码，且一条注解都没有」。必须显式 set +e。
          set +e
          set -uo pipefail
          # -V（verbose）而不是只 --output-on-failure：
          # 段错误/总线错误时，ctest 可能丢掉该用例的**部分**输出，
          # 于是日志里只剩一行 Exception，连「崩在哪个用例」都看不到。
          # -V 是流式的，崩溃前的 [ RUN ] 行一定留得住。
          ctest --test-dir build -C Release -V > ctest.log 2>&1
          code=$?
          tail -60 ctest.log
          if [ $code -ne 0 ]; then
            {
              echo "### ❌ 单元测试失败 (ctest 退出码 $code)"
              echo '```'; tail -c 4000 ctest.log; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=单元测试失败::ctest 退出码 $code，详见下方日志注解与步骤摘要"
            # 把日志**逐行**发成注解：这是唯一一条不需要鉴权就能读的通道
            # （job 日志要鉴权，步骤摘要在网页端要登录）。
            #
            # 只取 `[ RUN ] / [ ok ] / [FAIL]` 的轨迹：verbose 日志有几千行，
            # 整段塞进注解会被截断，而崩溃现场恰恰在**最后一条 [ RUN ]**。
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              [ "$n" -gt 30 ] && break
              echo "::error title=轨迹#$n::${line}"
            done < <(grep -aE '^[0-9]+: +\[' ctest.log | tail -30)
            # 再补上崩溃/异常附近的原始行
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              [ "$n" -gt 15 ] && break
              echo "::error title=现场#$n::${line}"
            done < <(grep -aE 'Exception|Test #|tests passed|tests failed|FAILED' ctest.log | head -15)
            exit 1
          fi

      # 内存承诺必须由**独立脚本**复核，而不是产品自己报告。
      # 内置的内存查询服务于用户，验收脚本服务于门禁，两者不能是同一个东西。
      - name: 独立复核内存承诺
        shell: bash
        run: |
          # GitHub 对 shell: bash 的默认调用是
          #     bash --noprofile --norc -eo pipefail {0}
          # **它自己就带 -e**。在脚本里写 \set -uo pipefail\ 只能追加、关不掉，
          # 于是任何失败都会在诊断语句之前把脚本掐死——症状是「步骤退出码
          # 原样等于失败命令的退出码，且一条注解都没有」。必须显式 set +e。
          set +e
          set -uo pipefail
          # 脚本就在 product/scripts/，而本 job 的工作目录已经是 product ——
          # 早先写 ../scripts/verify_memory.py 必然找不到文件。
          # 可执行文件路径也不同：MSVC 多配置生成器放 build/Release/，
          # 单配置生成器直接放 build/。写死任一路径 = 只在一个平台上能跑。
          EXE=""
          for cand in build/Release/mem_probe.exe build/mem_probe.exe build/mem_probe; do
            if [ -f "$cand" ]; then EXE="$cand"; break; fi
          done
          if [ -z "$EXE" ]; then
            echo "::error::找不到 mem_probe，无法复核内存承诺"
            find build -name 'mem_probe*' -type f 2>/dev/null || true
            exit 1
          fi
          echo "探针: $EXE"
          if ! python scripts/verify_memory.py --exe "$EXE" --budget-mb 8 > mem.log 2>&1; then
            echo "::error title=内存承诺未达成::$(tail -c 1200 mem.log | tr '\n' ' ')"
            cat mem.log
            exit 1
          fi
          cat mem.log

      - name: 工具链指纹（失败时也打印）
        if: always()
        shell: bash
        run: |
          echo "--- 系统 ---"; uname -a
          echo "--- 编译器 ---"
          cmake --version
          echo "--- libcurl ---"
          curl-config --version 2>/dev/null || echo "（无 libcurl-config）"
          echo "--- 生成器 ---"
          grep -E "^CMAKE_GENERATOR:|^CMAKE_C_COMPILER:" build/CMakeCache.txt 2>/dev/null \
            || echo "（无 CMakeCache.txt）"