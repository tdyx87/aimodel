# CI：在 Linux 与 macOS 上真实编译并跑全量用例。
#
# 为什么非做不可：`save_file_posix.cpp` 与 `local_http_posix.cpp` 只在非 Windows
# 上参与编译，而开发机是 Windows —— 这两份文件**从未被编译过**，更谈不上运行。
# 契约 §7 与 G3 审计早把「三平台验证」列为 G4 前置条件，本文件就是它的执行者。
#
# 与本地构建同源：CI 直接调用 `scripts/build.sh`（文档化入口），不另写一套构建
# 步骤——两套构建定义必然漂移。该脚本在缺 python/pytest 时会**报错退出**而不是
# 静默跳过，所以下面必须先把 Python 层依赖装好；装漏了 CI 会红，这正是想要的
# 失败方式（静默跳过才是「零覆盖却显示全绿」的来源）。
#
# 不缓存 build/ ：`_deps` 里的 googletest 构建产物与生成器/编译器版本强耦合，
# 缓存它会把「换镜像后莫名链接失败」引进来，省下的几十秒不值这个风险。

name: build-and-test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        # 构建与测试都在 product/ 这一层内完成（AGENTS.md 的「变层」）。
        working-directory: product
        shell: bash
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装 Python（E2E 需要 pytest + pytest-timeout）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 与 pyproject 的 pytest==7.4.4 钉版相容
          cache: pip
          cache-dependency-path: product/python/pyproject.toml

      - name: 安装 Python 层测试依赖（来源是 pyproject 的 dev extra）
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e "./python[dev]"

      # 门禁证据必须能比对与复现：把工具链指纹打进日志。
      # 注意不要用 `| head`——本作业的 bash 带 `-eo pipefail`，上游被 SIGPIPE
      # 打断会让这一步无辜变红；改用 `sed -n '1p'`（读完全部输入，不会提前退出）。
      - name: 环境指纹
        run: |
          echo "--- 系统 ---"; uname -a
          echo "--- 编译器 ---"; c++ --version | sed -n '1,2p'
          echo "--- CMake ---"; cmake --version | sed -n '1p'
          echo "--- 生成器 ---"; ninja --version 2>/dev/null || make --version | sed -n '1p'
          echo "--- Python ---"; python3 --version

      - name: 构建 + 全量测试（ctest + Python 单测 + 真实产物 E2E）
        run: ./scripts/build.sh Release
