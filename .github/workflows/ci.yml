# CI：在真实的三平台上编译并跑全量用例。
#
# 为什么非做不可：`save_file_posix.cpp` 与 `local_http_posix.cpp` 只在非 Windows
# 上参与编译，而开发机是 Windows —— 这两份文件从未被编译过，更谈不上运行。
#
# 本文件与本地构建同源：直接调用 `scripts/build.{ps1,sh}`（文档化入口），不另写
# 一套构建步骤——两套定义必然漂移。脚本在缺 python/pytest 时会**报错退出**而不是
# 静默跳过，所以下面必须先把 Python 层依赖装好；装漏了 CI 会红，这正是想要的
# 失败方式（静默跳过才是「零覆盖却显示全绿」的来源）。
#
# 放行顺序（按当前约定）：**先 Windows**，Linux/macOS 先只观察、后期再验证。
# 去掉它们的 experimental 标志才算「三平台验证」完成——在那之前，任何
# 「三平台已通过」的说法都不成立。
#
# 不缓存 build/：`_deps` 里的 googletest 产物与生成器/编译器版本强耦合，缓存它
# 会把「换镜像后莫名链接失败」引进来，省下的几十秒不值这个风险。

name: build-and-test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 非阻塞腿：Linux/macOS 当前只**观察**，不参与放行。它们的结论一旦被复核并
    # 修绿，就把 experimental 改成 false —— 那才叫三平台验证完成。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：当前的放行平台。显式钉死生成器与架构，让「构建工具链」成为
          # 受控变量——不指定时 CMake 的默认生成器**因机器而异**（本机默认是
          # Ninja + MinGW，运行器上会落到 Visual Studio + MSVC），那样「同一份
          # 源码两样结果」这一类问题又会重演。要复现就得能钉死它。
          # 不钉死 Visual Studio 的**版本号**，只钉死「用 MSVC」。
          # 曾经写死 "Visual Studio 17 2022"，结果 windows-latest 镜像一升级就
          # 变成 `could not find any instance of Visual Studio`——整个 Windows 腿
          # 从此一直红。硬钉版本号本身就是会腐烂的：运行器镜像跟着时间走，
          # 而仓库里的字符串不会。
          #
          # 现在交给 CMake 选运行器上的默认生成器。看似放弃了「可复现」，
          # 但指纹步骤会打印实际用的生成器与编译器，真出问题能对上；
          # 而一个跑不起来的 CI 比一个生成器会漂移的 CI 糟糕得多。
          # 需要在本地复现某个具体版本时，仍可显式传 -Generator。
          - os: windows-latest
            experimental: false
            script: >-
              pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build.ps1
              -Config Release
          # Linux / macOS：先观察。POSIX 专有代码只在这里被编译到，哪怕只是
          # 「编译不过」也值得提前知道。
          - os: ubuntu-latest
            experimental: true
            script: ./scripts/build.sh Release
          - os: macos-latest
            experimental: true
            script: ./scripts/build.sh Release
    defaults:
      run:
        # 构建与测试都在 product/ 这一层内完成（AGENTS.md 的「变层」）。
        working-directory: product
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装 Python（E2E 需要 pytest + pytest-timeout）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 与 pyproject 里 pytest==7.4.4 的钉版相容
          cache: pip
          cache-dependency-path: product/python/pyproject.toml

      # 用 `python` 而不是 `python3`：setup-python 在三个平台上都提供 `python`，
      # 而 Windows 的运行器上没有 `python3`。
      - name: 安装 Python 层测试依赖（来源是 pyproject 的 dev extra）
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      # shell 固定 bash，不从 matrix 取。
      # 两个原因：
      #   1) step 级的 `shell:` **不在 matrix 上下文白名单里**——写成
      #      `${{ matrix.shell }}` 会被 GitHub 静态校验拒绝
      #      （Unrecognized named-value: 'matrix'），工作流直接加载失败。
      #   2) Windows 运行器上 bash 是 Git Bash，本文件上方装依赖那步已经在用它，
      #      保持一致；调用 PowerShell 脚本时用 `pwsh` 显式起进程，不依赖调用 shell。
      # 因此 matrix 只承载「跑什么」，不承载「用什么 shell 跑」。
      - name: 构建 + 全量测试（ctest + Python 单测）
        shell: bash
        run: ${{ matrix.script }}

      # NSIS 编译器（makensis）是产出 Windows 安装器的必要条件。
      # 运行器镜像里有 NSIS，但**不在 PATH 上**，于是 cpack 直接报
      #   Cannot find NSIS compiler makensis
      # 而本机装过 NSIS，所以本地打包一直正常、CI 一直红——同一个缺陷，
      # 两边表现完全相反。这也是为什么「本机能打���」不能替代「CI 能打包」。
      #
      # 先找常见安装位置，找不到再装；两者都失败就明确报错，不静默跳过。
      - name: 确保 NSIS 可用（产出 Windows 安装器需要 makensis）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          found=""
          for p in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
            if [ -f "$p/makensis.exe" ]; then found="$p"; break; fi
          done
          if [ -z "$found" ]; then
            echo "镜像内未找到 NSIS，尝试 choco 安装"
            choco install nsis -y --no-progress
            for p in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
              if [ -f "$p/makensis.exe" ]; then found="$p"; break; fi
            done
          fi
          if [ -z "$found" ]; then
            echo "::error::找不到 makensis，NSIS 安装器无法产出"
            exit 1
          fi
          echo "NSIS 位于: $found"
          echo "$found" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$found")" >> "$GITHUB_PATH"

      # 产物 E2E 单独跑，且**必须真的跑**。
      #
      # 为什么要拆出来：上面那一步里的 pytest 会调用 test_package_artifact.py，
      # 但 build.{ps1,sh} 只构建+测试、**不打包**，所以那次调用必然 skip——
      # 步骤名里写着「真实产物 E2E」，实际覆盖率为零，报告却显示全绿。
      # 这正是本文件开头警告的「零覆盖却显示全绿」。这里补上真正的打包与验证。
      #
      # cpack 必须在 build 目录内执行：在源码根跑会留下 _CPack_Packages/
      # 与安装包本身（曾在仓库根留下过哈希不一致的旧包）。
      - name: 打包（供产物 E2E 使用）
        shell: bash
        working-directory: product/build
        run: cpack -C Release

      - name: 产物 E2E（找不到产物即失败，不允许 skip）
        shell: bash
        env:
          SAVE_INSPECTOR_REQUIRE_ARTIFACT: "1"
        run: python -m pytest tests/e2e/test_package_artifact.py -v

      # 指纹从构建产物里读，而不是 `c++ --version`：Windows 上没有 `c++` 这个
      # 命令，而 CMakeCache.txt 三平台都有。
      # 注意 Visual Studio 生成器**不缓存** CMAKE_CXX_COMPILER（编译器是按配置
      # 决定的），所以多打一行 GENERATOR_INSTANCE —— 那就是 VS 安装路径。
      # `if: always()` 让测试变红时也留下现场。
      - name: 工具链指纹（失败时也打印）
        if: always()
        shell: bash
        run: |
          echo "--- 系统 ---"; uname -a
          echo "--- Python ---"; python --version
          echo "--- 生成器与编译器 ---"
          grep -E "^CMAKE_GENERATOR:|^CMAKE_GENERATOR_INSTANCE:|^CMAKE_GENERATOR_PLATFORM:|^CMAKE_CXX_COMPILER:" \
            build/CMakeCache.txt || echo "（配置未成功，无 CMakeCache.txt）"
