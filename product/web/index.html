<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark light" />
        <title>aimodel · 我的电脑配置</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">⬡</span>
                    <span>aimodel</span>
                </div>
                <span class="badge-privacy">
                    <span aria-hidden="true">🛡</span>
                    数据仅在本机
                </span>
                <span class="topbar-spacer"></span>
                <button class="btn" id="refresh" type="button">
                    <span class="btn-icon" aria-hidden="true">⟳</span>
                    <span class="btn-text">刷新</span>
                </button>
                <!-- 屏幕阅读器播报（design-system §7） -->
                <span class="sr-only" id="live" role="status" aria-live="polite">正在检测你的电脑配置…</span>
            </header>

            <main id="content" class="grid" aria-busy="true">
                <!-- 首屏骨架屏 / 报告卡片由 app.js 渲染 -->
            </main>

            <footer class="footer">
                <span id="os-line">所有检测均在本机完成，数据不会离开你的设备</span>
                <button class="btn btn-quiet" id="refresh-footer" type="button">
                    <span class="btn-icon" aria-hidden="true">⟳</span>
                    <span class="btn-text">刷新</span>
                </button>
            </footer>
        </div>
        <script src="app.js"></script>
    </body>
</html>
