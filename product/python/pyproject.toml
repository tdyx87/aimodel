[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saveinspector-tools"
version = "0.1.0"
description = "存档查看器内部工具链（用户不可见，不随产品分发）"
requires-python = ">=3.10"

# 运行时零依赖：只用标准库。样本生成器要能在离线 CI 上跑。
dependencies = []

[project.optional-dependencies]
# pytest-timeout 不是可选项：下面的 [tool.pytest.ini_options] 声明了 timeout，
# 而缺了插件时该配置**会被静默忽略**（只报 PytestConfigWarning）。E2E 要拉起
# 真实可执行文件与浏览器，没有超时保护时一次挂死就能把门禁卡到天亮。
# 用 >= 而非 ==：本插件与 pytest 7/8/9 均兼容，锁死小版本只会互相打架。
dev = ["pytest==7.4.4", "pytest-timeout>=2.3"]

# 界面级 E2E（tests/e2e/test_ui_journey.py）专用，**单列而非并入 dev**。
#
# 为什么单列：界面 E2E 需要真实浏览器，是整套测试里对环境要求最高的一环。
# 并入 dev 会让每个装 dev 的环境都被迫背上一个重量级依赖；而它并不覆盖
# 全部场景——HTTP 层与产物层的关键路径另有用例。列为可选 extra，
# 想要完整覆盖的人显式安装 `pip install -e "./python[dev,ui]"`。
#
# 另注意：playwright 只装 Python 包，**不下载浏览器**——测试复用系统已装的
# Edge/Chrome（见 test_ui_journey._edge_executable）。少一个几百 MB 的
# 下载依赖，也少一个会在 CI 上抖动的外部源（这正是 NSIS 那次的教训）。
ui = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["saveinspector_tools*"]

[tool.pytest.ini_options]
# 同时收集内部工具链的格式用例与用户场景 E2E（E2E 从 ../tests/e2e 取，
# 相对本文件是上两级）。
testpaths = ["tests", "../tests/e2e"]
pythonpath = ["."]
addopts = "-q"
# E2E 需要拉起真实可执行文件，单用例可能耗时数秒
timeout = 300
