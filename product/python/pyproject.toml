[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saveinspector-tools"
version = "0.1.0"
description = "存档查看器内部工具链（用户不可见，不随产品分发）"
requires-python = ">=3.10"

# 运行时零依赖：只用标准库。样本生成器要能在离线 CI 上跑。
dependencies = []

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["saveinspector_tools*"]

[tool.pytest.ini_options]
# 同时收集内部工具链的格式用例与用户场景 E2E（E2E 从 ../tests/e2e 取，
# 相对本文件是上两级）。
testpaths = ["tests", "../tests/e2e"]
pythonpath = ["."]
addopts = "-q"
# E2E 需要拉起真实可执行文件，单用例可能耗时数秒
timeout = 300
